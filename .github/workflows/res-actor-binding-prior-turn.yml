name: RES prior-turn actor-binding versus role-binding test

on:
  push:
    branches:
      - res-chat-feasibility
    paths:
      - .github/workflows/res-actor-binding-prior-turn.yml
      - experiments/res_actor_binding_prior_turn/preregistration.md
      - experiments/res_actor_binding_prior_turn/run_actor_binding.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: res-actor-binding-prior-turn
  cancel-in-progress: false

jobs:
  actor-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feasibility branch
        uses: actions/checkout@v4
        with:
          ref: res-chat-feasibility
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned OpenAI SDK
        run: python -m pip install openai==3.11.0

      - name: Run preregistered actor-binding test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RES_ACTOR_BINDING_MODEL: gpt-5.6-terra
          RES_ACTOR_BINDING_SEED: "20260913"
        run: python experiments/res_actor_binding_prior_turn/run_actor_binding.py

      - name: Persist completed or partial checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/res_actor_binding_prior_turn/results
          if git diff --cached --quiet; then
            echo "No actor-binding checkpoint files to commit."
            exit 0
          fi
          git commit -m "Record RES actor-binding run $GITHUB_RUN_ID"
          git push origin HEAD:res-chat-feasibility
