name: RES Step 0 response-interface gate

on:
  push:
    branches:
      - res-chat-feasibility
    paths:
      - .github/workflows/res-step0-interface-gate.yml
      - experiments/res_step0_interface_gate/preregistration.md
      - experiments/res_step0_interface_gate/run_interface_gate.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: res-step0-interface-gate
  cancel-in-progress: false

jobs:
  interface-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      RES_MODEL_ID: Qwen/Qwen2.5-1.5B-Instruct
      RES_INTERFACE_SEED: "20260913"
      RES_INTERFACE_BATCH_SIZE: "8"

    steps:
      - name: Check out feasibility branch
        uses: actions/checkout@v4
        with:
          ref: res-chat-feasibility
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install transformers==4.48.3 safetensors==0.5.2

      - name: Freeze model revision
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git ls-remote https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct refs/heads/main | awk 'NR == 1 {print $1}')
          test -n "$revision"
          echo "RES_MODEL_REVISION=$revision" >> "$GITHUB_ENV"
          echo "Resolved model revision: $revision"

      - name: Run preregistered response-interface gate
        run: python experiments/res_step0_interface_gate/run_interface_gate.py

      - name: Persist completed results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          result_files=(
            experiments/res_step0_interface_gate/results/interface-gate-"$GITHUB_RUN_ID".json
            experiments/res_step0_interface_gate/results/interface-gate-"$GITHUB_RUN_ID".md
            experiments/res_step0_interface_gate/results/interface-gate-"$GITHUB_RUN_ID"-fixtures.jsonl
          )
          test "${#result_files[@]}" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${result_files[@]}"
          git diff --cached --quiet && { echo "Completed run produced no new result files."; exit 1; }
          git commit -m "Record RES response-interface gate $GITHUB_RUN_ID"
          git push origin HEAD:res-chat-feasibility
