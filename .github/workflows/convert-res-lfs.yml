name: Convert RES samples to Git LFS

on:
  push:
    branches:
      - res-actor-indexed-control-eval
    paths:
      - .github/workflows/convert-res-lfs.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out contribution branch
        uses: actions/checkout@v4
        with:
          ref: res-actor-indexed-control-eval
          fetch-depth: 0
          persist-credentials: true

      - name: Convert dataset and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          target="evals/registry/data/res_actor_indexed_control/samples.jsonl"
          git lfs install --local
          test -f "$target"
          git rm --cached "$target"
          git add "$target"
          git lfs ls-files | grep -F "$target"
          git rm .github/workflows/convert-res-lfs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Store RES samples with Git LFS"
          git push origin HEAD:res-actor-indexed-control-eval
