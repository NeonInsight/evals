name: Bootstrap frozen RES surface efficiency branch

on:
  push:
    branches: [res-surface-efficiency-assay]
    paths: [.res-sfe-bootstrap/**]

permissions:
  contents: write

concurrency:
  group: res-surface-efficiency-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct the locally validated tree
        run: |
          mkdir -p /tmp/res-sfe-final
          cat .res-sfe-bootstrap/part-* > /tmp/res-sfe-files.tar.gz
          tar -xzf /tmp/res-sfe-files.tar.gz -C /tmp/res-sfe-final
      - name: Commit implementation separately from the freeze
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/res-sfe-final/$path" "$path"
            git add "$path"
          done <<'FILES'
          .github/workflows/res-surface-efficiency-assay.yml
          experiments/res_surface_efficiency_assay/README.md
          experiments/res_surface_efficiency_assay/__init__.py
          experiments/res_surface_efficiency_assay/analysis_common.py
          experiments/res_surface_efficiency_assay/analysis_primary.py
          experiments/res_surface_efficiency_assay/analysis_secondary.py
          experiments/res_surface_efficiency_assay/analyze.py
          experiments/res_surface_efficiency_assay/control.json
          experiments/res_surface_efficiency_assay/fixture_generation.py
          experiments/res_surface_efficiency_assay/phase0.py
          experiments/res_surface_efficiency_assay/power_analysis.py
          experiments/res_surface_efficiency_assay/representation_validator.py
          experiments/res_surface_efficiency_assay/run.py
          experiments/res_surface_efficiency_assay/study.py
          experiments/res_surface_efficiency_assay/test_study.py
          FILES
          git rm -r .res-sfe-bootstrap .github/workflows/res-surface-efficiency-bootstrap.yml
          git commit -m 'Add frozen RES surface-efficiency assay'
          git rev-parse HEAD > /tmp/res-sfe-implementation-sha
      - name: Bind generated Phase 0 to the remote implementation commit
        run: |
          cp -a /tmp/res-sfe-final/. .
          IMPLEMENTATION_SHA="$(cat /tmp/res-sfe-implementation-sha)" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('experiments/res_surface_efficiency_assay')
          manifest_path = root / 'frozen_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['phase0_parent_commit_sha'] = os.environ['IMPLEMENTATION_SHA']
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True, ensure_ascii=False, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          hashes_path = root / 'hashes.sha256'
          relative = 'experiments/res_surface_efficiency_assay/frozen_manifest.json'
          lines = hashes_path.read_text(encoding='utf-8').splitlines()
          lines = [f'{digest}  {relative}' if line.endswith('  ' + relative) else line for line in lines]
          hashes_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Re-run the complete zero-call Phase 0 validation
        run: |
          python -m pip install transformers==4.48.3 tokenizers==0.21.0 jinja2==3.1.6 rapidfuzz==3.14.1 numpy==1.26.4 scipy==1.14.1
          python experiments/res_surface_efficiency_assay/phase0.py verify
          python -m unittest discover -s experiments/res_surface_efficiency_assay -p 'test_*.py' -v
          python experiments/res_surface_efficiency_assay/run.py preflight
          python experiments/res_surface_efficiency_assay/run.py token-audit
      - name: Commit and publish the verified freeze
        run: |
          git add .github/workflows/res-surface-efficiency-assay.yml experiments/res_surface_efficiency_assay
          git commit -m 'Freeze RES surface-efficiency Phase 0'
          git push origin HEAD:res-surface-efficiency-assay
          echo 'Published a preflight-only frozen branch. No target-model inference was run.' >> "$GITHUB_STEP_SUMMARY"
