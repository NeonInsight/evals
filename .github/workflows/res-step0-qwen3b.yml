name: RES Qwen2.5-3B sharded capability gate

on:
  push:
    branches:
      - res-chat-feasibility
    paths:
      - .github/workflows/res-step0-qwen3b.yml
      - experiments/res_step0_interface_gate/preregistration-qwen3b.md
      - experiments/res_step0_interface_gate/preregistration-qwen3b-execution-amendment.md
      - experiments/res_step0_interface_gate/run_interface_gate.py
      - experiments/res_step0_interface_gate/run_interface_gate_shard.py
      - experiments/res_step0_interface_gate/aggregate_interface_gate_shards.py
      - experiments/res_step0_interface_gate/next-qwen3b-gate-operation.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: res-step0-qwen3b-sharded
  cancel-in-progress: false

jobs:
  qwen3b-gate-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      RES_MODEL_ID: Qwen/Qwen2.5-3B-Instruct
      RES_MODEL_REVISION: aa8e72537993ba99e69dfaafa59ed015b17504d1
      RES_MODEL_DTYPE: bfloat16
      RES_INTERFACE_PREREG_PATH: experiments/res_step0_interface_gate/preregistration-qwen3b.md
      RES_INTERFACE_RESULT_PREFIX: interface-gate-qwen3b
      RES_INTERFACE_SEED: "20260913"
      RES_INTERFACE_BATCH_SIZE: "4"
      RES_INTERFACE_SEQUENCE_ID: qwen3b-gate-v2

    steps:
      - name: Check out feasibility branch
        uses: actions/checkout@v4
        with:
          ref: res-chat-feasibility
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve fixed sequence operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail
          operation=$(tr -d '[:space:]' < experiments/res_step0_interface_gate/next-qwen3b-gate-operation.txt)
          case "$operation" in
            five-key-rotation|five-schedule-change|minimal-release-approval|minimal-account-change)
              echo "kind=shard" >> "$GITHUB_OUTPUT"
              ;;
            aggregate)
              echo "kind=aggregate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown sequence operation: $operation" >&2
              exit 1
              ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU dependencies
        if: steps.operation.outputs.kind == 'shard'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install transformers==4.48.3 scikit-learn==1.6.1 safetensors==0.5.2

      - name: Run one preregistered capability-gate shard
        id: shard
        if: steps.operation.outputs.kind == 'shard'
        env:
          RES_INTERFACE_SHARD_ID: ${{ steps.operation.outputs.operation }}
        run: python experiments/res_step0_interface_gate/run_interface_gate_shard.py

      - name: Aggregate four completed shards
        id: aggregate
        if: steps.operation.outputs.kind == 'aggregate'
        run: python experiments/res_step0_interface_gate/aggregate_interface_gate_shards.py

      - name: Persist completed sequence unit
        if: steps.shard.outcome == 'success' || steps.aggregate.outcome == 'success'
        shell: bash
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          OPERATION_KIND: ${{ steps.operation.outputs.kind }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION_KIND" == "shard" ]]; then
            paths=(experiments/res_step0_interface_gate/results/shards/qwen3b-gate-v2/"$OPERATION".json)
          else
            paths=(
              experiments/res_step0_interface_gate/results/interface-gate-qwen3b-qwen3b-gate-v2.json
              experiments/res_step0_interface_gate/results/interface-gate-qwen3b-qwen3b-gate-v2.md
              experiments/res_step0_interface_gate/results/interface-gate-qwen3b-qwen3b-gate-v2-fixtures.jsonl
            )
          fi
          for path in "${paths[@]}"; do test -f "$path"; done
          git add "${paths[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "Sequence unit produced no new result."; exit 1; }
          git commit -m "Record RES Qwen3B gate $OPERATION"
          git pull --rebase origin res-chat-feasibility
          git push origin HEAD:res-chat-feasibility
