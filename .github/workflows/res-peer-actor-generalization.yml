name: RES fresh peer-to-peer actor-binding generalization

on:
  push:
    branches:
      - res-chat-feasibility
    paths:
      - .github/workflows/res-peer-actor-generalization.yml
      - experiments/res_peer_actor_generalization/preregistration.md
      - experiments/res_peer_actor_generalization/scenarios.jsonl
      - experiments/res_peer_actor_generalization/run_peer_actor_generalization.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: res-peer-actor-generalization
  cancel-in-progress: false

jobs:
  peer-actor-generalization:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feasibility branch
        uses: actions/checkout@v4
        with:
          ref: res-chat-feasibility
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned OpenAI SDK
        run: python -m pip install openai==3.11.0

      - name: Run preregistered fresh peer-to-peer actor test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RES_PEER_ACTOR_MODEL: gpt-5.6-terra
          RES_PEER_ACTOR_SEED: "20260913"
        run: python experiments/res_peer_actor_generalization/run_peer_actor_generalization.py

      - name: Persist completed or partial checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/res_peer_actor_generalization/results
          if git diff --cached --quiet; then
            echo "No fresh peer-actor checkpoint files to commit."
            exit 0
          fi
          git commit -m "Record RES peer-actor run $GITHUB_RUN_ID"
          git push origin HEAD:res-chat-feasibility
