name: RES multi-turn episodic-continuity battery

on:
  push:
    branches:
      - res-chat-feasibility
    paths:
      - .github/workflows/res-multiturn-continuity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: res-multiturn-continuity
  cancel-in-progress: false

jobs:
  multiturn:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feasibility branch
        uses: actions/checkout@v4
        with:
          ref: res-chat-feasibility
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned OpenAI SDK
        run: python -m pip install openai==3.11.0

      - name: Run preregistered multi-turn battery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RES_MODELS: gpt-5.6-luna,gpt-5.6-terra
          RES_MULTITURN_SEED: "20260910"
        run: python experiments/res_multiturn_continuity/run_multiturn.py

      - name: Persist completed or partial checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/res_multiturn_continuity/results
          if git diff --cached --quiet; then
            echo "No multi-turn checkpoint files to commit."
            exit 0
          fi
          git commit -m "Record RES multi-turn run $GITHUB_RUN_ID"
          git push origin HEAD:res-chat-feasibility
